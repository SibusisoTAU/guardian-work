<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Admin - My Guardian Link</title></head>
<body class="bg-[#0F1A14] text-white p-4">
<script>if(prompt('Admin PIN (7777)')!=='7777'){location.href='index.html';}</script>
<h1 class="font-bold text-xl text-[#F4A21A]">MY GUARDIAN LINK - ADMIN DASH V4.5</h1>
<div class="grid md:grid-cols-4 gap-3 mt-4">
<div class="bg-white text-black rounded-xl p-4"><div class="text-xs">Job Seekers</div><div id="sSeekers" class="text-2xl font-bold">0</div></div>
<div class="bg-white text-black rounded-xl p-4"><div class="text-xs">Profile Views</div><div id="sViews" class="text-2xl font-bold">0</div></div>
<div class="bg-white text-black rounded-xl p-4"><div class="text-xs">Applications</div><div id="sApps" class="text-2xl font-bold">0</div></div>
<div class="bg-[#F4A21A] text-black rounded-xl p-4"><div class="text-xs">Ad Revenue</div><div id="sRev" class="text-2xl font-bold">R0</div></div>
</div>
<div class="mt-6 grid md:grid-cols-2 gap-4">
<div class="bg-white text-black rounded-xl p-4"><h3 class="font-bold text-sm">📩 Applications</h3><div id="appList" class="text-xs mt-2"></div></div>
<div class="bg-white text-black rounded-xl p-4"><h3 class="font-bold text-sm">👥 Users</h3><div id="userList" class="mt-2 text-xs"></div></div>
</div>
<script>
const SUPABASE_URL = 'https://your-project.supabase.co';
const SUPABASE_KEY = 'your-anon-key';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let profiles = [], applications = [], ads = [];

async function loadAdminData() {
  try {
    const { data: profileData } = await supabase.from('profiles').select('*');
    const { data: appData } = await supabase.from('applications').select('*');
    const { data: adData } = await supabase.from('ads').select('*');
    
    profiles = profileData || [];
    applications = appData || [];
    ads = adData || [];

    document.getElementById('sSeekers').innerText = profiles.length;
    document.getElementById('sApps').innerText = applications.length;
    
    const totalClicks = ads.reduce((sum, ad) => sum + (ad.clicks || 0), 0);
    document.getElementById('sRev').innerText = 'R' + (totalClicks * 5);

    document.getElementById('appList').innerHTML = applications.map(a => 
      `<div class="border-b py-1 flex justify-between"><span>${a.seeker_name} - ${a.job}</span><button onclick="forwardApp('${a.id}')" class="bg-[#075D3B] text-white px-2 py-0.5 rounded">Forward</button></div>`
    ).join('') || 'No applications';

    document.getElementById('userList').innerHTML = profiles.map(p =>
      `<div class="flex justify-between border-b py-1"><span>${p.name} | ${p.job}</span><button onclick="del('${p.id}')" class="text-red-600">Delete</button></div>`
    ).join('');
  } catch (err) {console.error('Error:',err);}
}

async function del(id) {
  if (confirm('Delete user?')) {
    try {
      await supabase.from('profiles').delete().eq('id', id);
      loadAdminData();
    } catch (err) {alert('Error');}
  }
}

async function forwardApp(id) {
  try {
    await supabase.from('applications').delete().eq('id', id);
    alert('Forwarded to employer!');
    loadAdminData();
  } catch (err) {alert('Error');}
}

loadAdminData();
supabase.channel('admin').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadAdminData()).on('postgres_changes',{event:'*',schema:'public',table:'applications'},()=>loadAdminData()).subscribe();
</script>
<div class="text-center text-[10px] text-gray-400 mt-6"><a href="index.html" class="underline">← Back</a></div>
</body></html>
